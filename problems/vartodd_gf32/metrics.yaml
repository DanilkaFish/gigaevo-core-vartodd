display_order: [fitness, runtime, is_valid]
specs:
  fitness:
    description: Primary objective. rank + sum(P)/P.size() (P is the found decomposition), plus shaping — +1 if a saved-path child does not beat its loaded/branch rank, a further +4 if it also searched with a larger effective TODD limit_bucket than the loaded path, and a reward (up to -0.8, only below ~2000) when the converged effective limit_bucket is low and finite (TOHPE-only counts as 0). Rank differences always dominate the shaping.
    decimals: 3
    is_primary: true
    higher_is_better: false
    upper_bound: 1280
    lower_bound: 1190
    include_in_prompts: true
    significant_change: 0.01
    sentinel_value: 1280
  runtime:
    description: Program runtime in seconds
    decimals: 0
    is_number: true
    is_primary: false
    upper_bound: 13200
    lower_bound: 0
    higher_is_better: false
    include_in_prompts: true
    significant_change: 1
    sentinel_value: 13200

  is_valid:
    description: Program validity (1 valid, 0 invalid)
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0
    upper_bound: 1
    include_in_prompts: true
    sentinel_value: 0
    significant_change: 1

  loaded_rank:
    description: Rank the program started searching from (initial_rank for ab-initio, branch point for saved-path refiners). MAP-Elites strategy descriptor; not an objective.
    decimals: 0
    is_number: true
    is_primary: false
    higher_is_better: false
    lower_bound: 1200
    upper_bound: 1701
    include_in_prompts: false
    sentinel_value: 1701
    significant_change: 1
  rank_improved:
    description: Whether the program beat its applicable starting or loaded-path rank (1=yes, 0=no). Used as the first within-cell GF32 archive-retention criterion.
    decimals: 0
    is_number: true
    is_primary: false
    higher_is_better: true
    lower_bound: 0
    upper_bound: 1
    include_in_prompts: false
    sentinel_value: 0
    significant_change: 1
