display_order: [fitness, runtime, is_valid]
specs:
  fitness:
    description: Primary objective. rank + sum(P)/P.size() (P is the found decomposition).
    decimals: 3
    is_primary: true
    higher_is_better: false
    upper_bound: 420
    lower_bound: 380
    include_in_prompts: true
    significant_change: 0.01
    sentinel_value: 420
  runtime:
    description: Program runtime in seconds
    decimals: 0
    is_number: true
    is_primary: false
    upper_bound: 3200
    lower_bound: 0
    higher_is_better: false
    include_in_prompts: true
    significant_change: 1
    sentinel_value: 3200

  is_valid:
    description: Program validity (1 valid, 0 invalid)
    decimals: 0
    is_primary: false
    higher_is_better: true
    lower_bound: 0
    upper_bound: 1
    include_in_prompts: true
    sentinel_value: 0
    significant_change: 1

  loaded_rank:
    description: Rank the program started searching from (initial_rank for ab-initio, branch point for saved-path refiners). MAP-Elites strategy descriptor; not an objective.
    decimals: 0
    is_number: true
    is_primary: false
    higher_is_better: false
    lower_bound: 380
    upper_bound: 420
    include_in_prompts: false
    sentinel_value: 420
    significant_change: 1
