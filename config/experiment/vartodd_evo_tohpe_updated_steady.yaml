# @package _global_

# Continuous GF(2^16) evolution for the updated TOHPE/TOHPEprefix interface.
# Unlike the batch experiment, every mutation independently samples one parent
# pair and evaluation completion immediately opens capacity for another child.
defaults:
  - base
  - override /pipeline: vartodd_pipeline
  - override /algorithm: vartodd_diverse_gf16_tohpe_updated
  - override /llm: openrouter_vartodd_evolution
  - override /evolution: steady_state
  - _self_

problem:
  name: vartodd_evo_tohpe_updated

num_parents: 2

# The steady engine has two pools of this size: mutation producers and
# produced children awaiting ingestion. This keeps work available without a
# batch-generation barrier.
max_in_flight: 6
engine_config:
  max_in_flight: ${max_in_flight}

# Run six evaluations and pre-create one additional group of six tasks. The
# extra tasks wait on the runner semaphore and start as slots become free.
max_concurrent_dags: 6
runner_config:
  prefetch_factor: 2

# Keep the successful GF16 selector unchanged (WeightedEliteSelector,
# lambda=5.0). In steady state it directly samples one pair per mutation;
# its child-count penalty reduces repeated use of the same top parents.
vartodd_call_timeout: 3800
vartodd_soft_timeout_grace_s: 200
