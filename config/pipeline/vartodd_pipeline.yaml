# @package _global_

# Vartodd pipeline:
# - validator aux/path report is available to insights, lineage, and mutation context
# - live saved paths are injected by MutationAgent, not by a DAG stage

# Which LLM/context consumers receive validator aux/path diagnostics.
# Override examples:
#   vartodd_aux_info_stages=[mutation]
#   vartodd_aux_info_stages=[insights,mutation]
#   vartodd_aux_info_stages=[]
dag_timeout: 20000

# Persistent execution cache for initial programs: entrypoint payloads are
# stored on disk keyed by code+helper hash, so re-running evolution (fresh
# Redis DB) reuses cached fitness/runtime/aux evidence instead of re-executing
# hours-long seeds. Insights and mutation context always recompute fresh.
# Disable with initial_exec_cache_dir=null; delete the directory to force
# re-evaluation.
initial_exec_cache_dir: ${problem.dir}/initial_programs/.exec_cache

vartodd_aux_info_stages:
  - insights
  - lineage
  - mutation

evolution_context:
  _target_: gigaevo.entrypoint.evolution_context.EvolutionContext
  problem_ctx: ${problem_context}
  llm_wrapper: ${oc.select:llm_mutation,${llm}}
  storage: ${ref:redis_storage}
  prompts_dir: ${prompts.dir}
  prompt_fetcher: ${prompt_fetcher}
  memory_provider: ${memory_provider}

dag_blueprint:
  _target_: gigaevo.runner.dag_blueprint.DAGBlueprint
  _convert_: all
  nodes:
    ValidateCodeStage:
      _target_: gigaevo.programs.stages.validation.ValidateCodeStage
      _partial_: true
      max_code_length: ${max_code_length}
      timeout: ${stage_timeout}
      safe_mode: true

    CallProgramFunction:
      _target_: custom.additional_stages.CachedCallProgramFunction
      _partial_: true
      function_name: entrypoint
      python_path:
        - ${problem.dir}
      timeout: 3200
      soft_timeout_grace_s: 200
      cache_dir: ${initial_exec_cache_dir}
      cache_key_files:
        - ${problem.dir}/helper.py

    CallValidatorFunction:
      _target_: custom.additional_stages.BroaderCallValidatorFunction
      _partial_: true
      path: ${problem.dir}/validate.py
      function_name: validate
      timeout: ${stage_timeout}

    ComputeComplexityStage:
      _target_: gigaevo.programs.stages.complexity.ComputeComplexityStage
      _partial_: true
      timeout: ${stage_timeout}

    ComputeTimeStage:
      _target_: custom.additional_stages.ComputeTimeStage
      _partial_: true
      timeout: 60

    DistillMetrics:
      _target_: custom.additional_stages.DistillMetrics
      _partial_: true
      timeout: 60

    DistillNonMetrics:
      _target_: custom.additional_stages.DistillNonMetrics
      _partial_: true
      timeout: 60

    MergeMetricsStage1:
      _target_: gigaevo.programs.stages.json_processing.MergeStrFloatDict
      _partial_: true
      timeout: ${stage_timeout}

    MergeMetricsStage2:
      _target_: gigaevo.programs.stages.json_processing.MergeStrFloatDict
      _partial_: true
      timeout: ${stage_timeout}

    EnsureMetricsStage:
      _target_: gigaevo.programs.stages.metrics.EnsureMetricsStage
      _partial_: true
      metrics_factory: ${ref:metrics_context::get_sentinels}
      metrics_context: ${metrics_context}
      timeout: ${stage_timeout}

    EnsureNonMetricsStage:
      _target_: custom.additional_stages.EnsureNonMetricsStage
      _partial_: true
      aux_info_stages: ${vartodd_aux_info_stages}
      timeout: 60

    InsightsStage:
      _target_: custom.additional_stages.AuxControlledInsightsStage
      _partial_: true
      llm: ${oc.select:llm_insights,${llm}}
      task_description: ${ref:problem_context::task_description}
      metrics_context: ${metrics_context}
      max_insights: ${max_insights}
      prompts_dir: ${problem.dir}/prompts
      aux_info_stages: ${vartodd_aux_info_stages}
      timeout: ${stage_timeout}

    ExecutionDigestStage:
      _target_: custom.additional_stages.ExecutionDigestStage
      _partial_: true
      aux_info_stages: ${vartodd_aux_info_stages}
      timeout: 30

    DescendantProgramIds:
      _target_: gigaevo.programs.stages.collector.DescendantProgramIds
      _partial_: true
      storage: ${ref:redis_storage}
      selector:
        _target_: gigaevo.programs.stages.ancestry_selector.AncestrySelector
        metrics_context: ${metrics_context}
        strategy: best_fitness
        max_selected: 2
      timeout: ${stage_timeout}

    AncestorProgramIds:
      _target_: gigaevo.programs.stages.collector.AncestorProgramIds
      _partial_: true
      storage: ${ref:redis_storage}
      selector:
        _target_: gigaevo.programs.stages.ancestry_selector.AncestrySelector
        metrics_context: ${metrics_context}
        strategy: best_fitness
        max_selected: 2
      timeout: ${stage_timeout}

    LineageStage:
      _target_: custom.additional_stages.AuxControlledLineageStage
      _partial_: true
      llm: ${oc.select:llm_lineage,${oc.select:llm_insights,${llm}}}
      task_description: ${ref:problem_context::task_description}
      metrics_context: ${metrics_context}
      storage: ${ref:redis_storage}
      aux_info_stages: ${vartodd_aux_info_stages}
      timeout: ${stage_timeout}

    LineagesToDescendants:
      _target_: gigaevo.programs.stages.insights_lineage.LineagesToDescendants
      _partial_: true
      storage: ${ref:redis_storage}
      source_stage_name: LineageStage
      timeout: ${stage_timeout}

    LineagesFromAncestors:
      _target_: gigaevo.programs.stages.insights_lineage.LineagesFromAncestors
      _partial_: true
      storage: ${ref:redis_storage}
      source_stage_name: LineageStage
      timeout: ${stage_timeout}

    EvolutionaryStatisticsCollector:
      _target_: gigaevo.programs.stages.collector.EvolutionaryStatisticsCollector
      _partial_: true
      storage: ${ref:redis_storage}
      metrics_context: ${metrics_context}
      timeout: ${stage_timeout}

    MutationContextStage:
      _target_: custom.additional_stages.AuxControlledMutationContextStage
      _partial_: true
      metrics_context: ${metrics_context}
      aux_info_stages: ${vartodd_aux_info_stages}
      timeout: 600

  data_flow_edges:
    - source_stage: CallProgramFunction
      destination_stage: CallValidatorFunction
      input_name: payload

    - source_stage: CallValidatorFunction
      destination_stage: DistillMetrics
      input_name: data

    - source_stage: CallValidatorFunction
      destination_stage: DistillNonMetrics
      input_name: data

    - source_stage: DistillNonMetrics
      destination_stage: EnsureNonMetricsStage
      input_name: data

    - source_stage: ComputeComplexityStage
      destination_stage: MergeMetricsStage1
      input_name: first

    - source_stage: DistillMetrics
      destination_stage: MergeMetricsStage1
      input_name: second

    - source_stage: MergeMetricsStage1
      destination_stage: MergeMetricsStage2
      input_name: first

    - source_stage: ComputeTimeStage
      destination_stage: MergeMetricsStage2
      input_name: second

    - source_stage: MergeMetricsStage2
      destination_stage: EnsureMetricsStage
      input_name: candidate

    - source_stage: EnsureMetricsStage
      destination_stage: MutationContextStage
      input_name: metrics

    - source_stage: InsightsStage
      destination_stage: MutationContextStage
      input_name: insights

    - source_stage: EnsureNonMetricsStage
      destination_stage: MutationContextStage
      input_name: non_metrics

    - source_stage: EnsureNonMetricsStage
      destination_stage: ExecutionDigestStage
      input_name: data

    - source_stage: DescendantProgramIds
      destination_stage: LineagesToDescendants
      input_name: descendant_ids

    - source_stage: AncestorProgramIds
      destination_stage: LineagesFromAncestors
      input_name: ancestor_ids

    - source_stage: LineagesToDescendants
      destination_stage: MutationContextStage
      input_name: lineage_descendants

    - source_stage: LineagesFromAncestors
      destination_stage: MutationContextStage
      input_name: lineage_ancestors

    - source_stage: EvolutionaryStatisticsCollector
      destination_stage: MutationContextStage
      input_name: evolutionary_statistics

    - source_stage: ExecutionDigestStage
      destination_stage: MutationContextStage
      input_name: formatted

  exec_order_deps:
    CallProgramFunction:
      - _target_: gigaevo.programs.dag.automata.ExecutionOrderDependency
        stage_name: ValidateCodeStage
        condition: success

    ComputeTimeStage:
      - _target_: gigaevo.programs.dag.automata.ExecutionOrderDependency
        stage_name: CallValidatorFunction
        condition: always

    InsightsStage:
      - _target_: gigaevo.programs.dag.automata.ExecutionOrderDependency
        stage_name: CallValidatorFunction
        condition: success
      - _target_: gigaevo.programs.dag.automata.ExecutionOrderDependency
        stage_name: EnsureMetricsStage
        condition: always
      - _target_: gigaevo.programs.dag.automata.ExecutionOrderDependency
        stage_name: EnsureNonMetricsStage
        condition: always

    LineageStage:
      - _target_: gigaevo.programs.dag.automata.ExecutionOrderDependency
        stage_name: CallValidatorFunction
        condition: success
      - _target_: gigaevo.programs.dag.automata.ExecutionOrderDependency
        stage_name: EnsureMetricsStage
        condition: always
      - _target_: gigaevo.programs.dag.automata.ExecutionOrderDependency
        stage_name: EnsureNonMetricsStage
        condition: always

    LineagesToDescendants:
      - _target_: gigaevo.programs.dag.automata.ExecutionOrderDependency
        stage_name: LineageStage
        condition: success

    LineagesFromAncestors:
      - _target_: gigaevo.programs.dag.automata.ExecutionOrderDependency
        stage_name: LineageStage
        condition: success

    EvolutionaryStatisticsCollector:
      - _target_: gigaevo.programs.dag.automata.ExecutionOrderDependency
        stage_name: EnsureMetricsStage
        condition: always

    ExecutionDigestStage:
      - _target_: gigaevo.programs.dag.automata.ExecutionOrderDependency
        stage_name: EnsureNonMetricsStage
        condition: always

  max_parallel_stages: ${dag_concurrency}
  dag_timeout: ${dag_timeout}
