# @package _global_

# Three independent parent populations share one matrix-specific Path Store.
defaults:
  - vartodd_diverse_gf16
  - _self_

mid_root_reuse_limit: 6
mid_family_reuse_limit: 8
near_family_reuse_limit: 7
near_path_reuse_limit: 3
mid_no_improvement_penalty: 12.0
near_no_improvement_penalty: 8.0
rank_sampling_temperature: 8.0
rank_sampling_child_penalty: 0.15
near_rank_sampling_temperature: 4.0
near_rank_sampling_child_penalty: 0.1

vartodd_islands_route_context:
  _target_: custom.vartodd_islands_context.VartoddIslandsRouteContextProvider
  problem_dir: ${problem.dir}
  near_end_path_top_k: 4
  mid_margin_path_top_k: 8
  selectable_paths_per_rank: 2
  path_cards_max_chars: 24000
  parent_aux_max_chars: 12000
  mid_root_reuse_limit: ${mid_root_reuse_limit}
  mid_family_reuse_limit: ${mid_family_reuse_limit}
  near_family_reuse_limit: ${near_family_reuse_limit}
  near_path_reuse_limit: ${near_path_reuse_limit}

mutation_operator:
  # The strategy selects one required regime before selecting its parents.
  mutation_regime_guidance: []
  mutation_regime_probability: 0.0
  live_path_store_root_dir: null
  route_context_provider: ${ref:vartodd_islands_route_context}

ab_initio_behavior_space:
  _target_: gigaevo.config.helpers.build_behavior_space
  keys:
    - ${primary_key}
    - runtime
    - loaded_rank
    - ${validity_key}
  bounds:
    - ${primary_bounds}
    - ${runtime_bounds}
    - ${loaded_rank_bounds}
    - ${validity_bounds}
  resolutions: [25, 4, 10, 2]
  binning_types:
    - ${binning_type}
    - linear
    - linear
    - linear
  dynamic: true
  expansion_buffer_ratio: 0.1

mid_margin_behavior_space:
  _target_: gigaevo.config.helpers.build_behavior_space
  keys:
    - ${primary_key}
    - runtime
    - loaded_rank
    - ${validity_key}
  bounds:
    - ${primary_bounds}
    - ${runtime_bounds}
    - ${loaded_rank_bounds}
    - ${validity_bounds}
  resolutions: [25, 4, 10, 2]
  binning_types:
    - ${binning_type}
    - linear
    - linear
    - linear
  dynamic: true
  expansion_buffer_ratio: 0.1

near_end_behavior_space:
  _target_: gigaevo.config.helpers.build_behavior_space
  keys:
    - ${primary_key}
    - runtime
    - loaded_rank
    - ${validity_key}
  bounds:
    - ${primary_bounds}
    - ${runtime_bounds}
    - ${loaded_rank_bounds}
    - ${validity_bounds}
  resolutions: [25, 4, 10, 2]
  binning_types:
    - ${binning_type}
    - linear
    - linear
    - linear
  dynamic: true
  expansion_buffer_ratio: 0.1

islands:
  - _target_: gigaevo.evolution.strategies.map_elites.IslandConfig
    island_id: ab_initio
    max_size: 35
    behavior_space: ${ab_initio_behavior_space}
    archive_selector:
      _target_: custom.archive_selectors.RankAwareRetentionSelector
      fitness_keys:
        - ${primary_key}
      fitness_key_higher_is_better:
        - ${higher_is_better}
    elite_selector:
      _target_: custom.archive_selectors.RankWeightedEliteSelector
      fitness_key: ${primary_key}
      fitness_key_higher_is_better: ${higher_is_better}
      rank_temperature: ${rank_sampling_temperature}
      child_penalty: ${rank_sampling_child_penalty}
      epsilon: 1e-8
    archive_remover:
      _target_: gigaevo.evolution.strategies.map_elites.FitnessArchiveRemover
      fitness_key: ${primary_key}
      fitness_key_higher_is_better: ${higher_is_better}
    migrant_selector:
      _target_: gigaevo.evolution.strategies.map_elites.TopFitnessMigrantSelector
      fitness_key: ${primary_key}
      fitness_key_higher_is_better: ${higher_is_better}

  - _target_: gigaevo.evolution.strategies.map_elites.IslandConfig
    island_id: mid_margin
    max_size: 35
    behavior_space: ${mid_margin_behavior_space}
    archive_selector:
      _target_: custom.archive_selectors.RankAwareRetentionSelector
      fitness_keys:
        - ${primary_key}
      fitness_key_higher_is_better:
        - ${higher_is_better}
    elite_selector:
      _target_: custom.archive_selectors.RankImprovementRankWeightedEliteSelector
      fitness_key: ${primary_key}
      fitness_key_higher_is_better: ${higher_is_better}
      rank_temperature: ${rank_sampling_temperature}
      child_penalty: ${rank_sampling_child_penalty}
      epsilon: 1e-8
      no_improvement_penalty: ${mid_no_improvement_penalty}
    archive_remover:
      _target_: gigaevo.evolution.strategies.map_elites.FitnessArchiveRemover
      fitness_key: ${primary_key}
      fitness_key_higher_is_better: ${higher_is_better}
    migrant_selector:
      _target_: gigaevo.evolution.strategies.map_elites.TopFitnessMigrantSelector
      fitness_key: ${primary_key}
      fitness_key_higher_is_better: ${higher_is_better}

  - _target_: gigaevo.evolution.strategies.map_elites.IslandConfig
    island_id: near_end
    max_size: 35
    behavior_space: ${near_end_behavior_space}
    archive_selector:
      _target_: custom.archive_selectors.RankAwareRetentionSelector
      fitness_keys:
        - ${primary_key}
      fitness_key_higher_is_better:
        - ${higher_is_better}
    elite_selector:
      _target_: custom.archive_selectors.RankImprovementRankWeightedEliteSelector
      fitness_key: ${primary_key}
      fitness_key_higher_is_better: ${higher_is_better}
      rank_temperature: ${near_rank_sampling_temperature}
      child_penalty: ${near_rank_sampling_child_penalty}
      epsilon: 1e-8
      no_improvement_penalty: ${near_no_improvement_penalty}
    archive_remover:
      _target_: gigaevo.evolution.strategies.map_elites.FitnessArchiveRemover
      fitness_key: ${primary_key}
      fitness_key_higher_is_better: ${higher_is_better}
    migrant_selector:
      _target_: gigaevo.evolution.strategies.map_elites.TopFitnessMigrantSelector
      fitness_key: ${primary_key}
      fitness_key_higher_is_better: ${higher_is_better}

evolution_strategy:
  _target_: gigaevo.evolution.strategies.map_elites.MapElitesMultiIsland
  island_configs: ${islands}
  program_storage: ${ref:redis_storage}
  migration_interval: ${migration_interval}
  enable_migration: false
  max_migrants_per_island: ${max_migrants_per_island}
  initial_island_id: ab_initio
  bootstrap_source_island: ab_initio
  bootstrap_until_size: 8
  bootstrap_mix_probability: 0.70
  steady_mix_probability: 0.15
  route_context_provider: ${ref:vartodd_islands_route_context}
  mutation_routes:
    - regime_id: ab_initio
      island_id: ab_initio
      probability: 0.35
      context_profile: ab_initio
    - regime_id: mid_margin
      island_id: mid_margin
      probability: 0.35
      context_profile: path_refinement
    - regime_id: near_end
      island_id: near_end
      probability: 0.3
      context_profile: path_refinement
